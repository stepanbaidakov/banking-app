[project]
name = "bankig_app"
version = "0.1.0"
description = ""
authors = [
    {name = "Stepan Baidakov"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.2.1"
flake8 = "^7.3.0"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.17.0"

[tool.black]
line-length = 119
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = true
extend_skip = [".venv", "venv", "build", "dist"]

[tool.mypy]
files = ["src", "tests"]
exclude = '(^|/)(\.venv|venv|build|dist)/'
ignore_missing_imports = true
check_untyped_defs = true